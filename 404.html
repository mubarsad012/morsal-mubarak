<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Morsal Mubarak</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; --bg: #f8f7f3; --ink: #0e1726; --ink-2: #4a5160; --accent: #ff5c35; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0f17; --ink: #eef1f6; --ink-2: #b8bfcc; --accent: #ff7a57; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
    main { max-width: 520px; text-align: center; }
    h1 { font: 600 clamp(2rem, 6vw, 3rem)/1.1 Georgia, serif; margin: 0 0 .4em; }
    p { color: var(--ink-2); }
    a { display: inline-block; margin-top: 12px; padding: 12px 22px; border-radius: 999px; background: var(--accent); color: #160600; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The link may be mistyped, or the page may have moved.</p>
    <a href="./">Go to Morsal Mubarak's portfolio</a>
  </main>
  <script>
    // Works for both user sites (/) and project sites (/repo-name/)
    (function () { var a = document.querySelector('a'); var seg = location.pathname.split('/').filter(Boolean); if (location.hostname.endsWith('github.io') && seg.length) a.href = '/' + seg[0] + '/'; else a.href = '/'; })();
  </script>
</body>
</html>
